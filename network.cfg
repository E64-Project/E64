# BMC64 R3 network and clock configuration
# Edit with a plain-text editor. Names and YES/NO values are case-sensitive.
# Use one KEY=VALUE per line. Lines starting with # and empty lines are ignored.
# Restart BMC64 after editing. Missing file defaults to DHCP.
# Invalid or unknown settings reject the whole file and use DHCP defaults.

# MODE: DHCP gets IP/netmask/gateway/DNS from the router; STATIC uses below.
MODE=DHCP

# Only used when MODE=STATIC. Choose an unused address on your LAN.
# To preserve R1's isolated LAN: IP=192.168.1.64, GATEWAY=0.0.0.0,
# DNS=0.0.0.0. For Internet access, supply your actual router and DNS.
IP=192.168.1.64
NETMASK=255.255.255.0
GATEWAY=0.0.0.0
DNS=0.0.0.0

# NTP synchronizes the BMC64 system clock after networking comes up.
# NTP_SERVER can be an IPv4 address or a DNS hostname (DNS must work).
NTP_ENABLED=YES
NTP_SERVER=192.168.1.5

# Standard-time offset in whole hours from UTC (Eastern=-5, Central=-6).
# DST_ENABLED=YES applies current US second-Sunday-March / first-Sunday-
# November rules after each successful NTP update (15-minute interval).
# Set NO outside US regions using different daylight-saving rules.
TIMEZONE=-5
DST_ENABLED=YES
